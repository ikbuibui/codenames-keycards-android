name: Release signed APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    env:
      RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          release_store_file="$RUNNER_TEMP/release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$release_store_file"
          echo "RELEASE_STORE_FILE=$release_store_file" >> "$GITHUB_ENV"

      - name: Test and build signed release APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Verify APKs and create checksums
        run: |
          for abi in arm64-v8a armeabi-v7a x86 x86_64 universal; do
            source="app/build/outputs/apk/release/app-${abi}-release.apk"
            destination="Codenames-Keycards-${GITHUB_REF_NAME}-${abi}.apk"
            test -f "$source"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$source"
            cp "$source" "$destination"
          done
          sha256sum Codenames-Keycards-*.apk > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            Codenames-Keycards-*.apk \
            SHA256SUMS \
            --generate-notes
